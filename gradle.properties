kotlin.code.style=official

#Gradle
# The daemon holds the Kotlin/Native linker, and `build` links every iOS/macOS framework, so it
# needs real headroom. CI bounds concurrency with --max-workers instead of raising this further.
org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8
org.gradle.parallel=true

#Kotlin
# Was pinned at 2 GB via -Dkotlin.daemon.jvm.options, which OOM'd compiling the wasmJs test target.
kotlin.daemon.jvmargs=-Xmx4g

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

#MPP
org.gradle.configuration-cache=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
