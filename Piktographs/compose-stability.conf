// Classes the Compose compiler should treat as stable.
//
// The Kodices model types are immutable value holders, but they live in a module that deliberately
// has no Compose dependency, so they cannot carry @Stable / @Immutable annotations themselves.
// Declaring them here is what lets ElementUI and its subtree skip recomposition.
//
// Regenerate the stability report with:
//   ./gradlew :Piktographs:compileKotlinJvm -Pcompose.reports --rerun-tasks
com.iktwo.kodices.content.Content
com.iktwo.kodices.elements.ProcessedElement
com.iktwo.kodices.elements.InputElement
com.iktwo.kodices.inputvalidation.Validation
com.iktwo.kodices.inputvalidation.RangeValidation
kotlinx.serialization.json.JsonElement
kotlinx.serialization.json.JsonObject
kotlinx.serialization.json.JsonArray
kotlinx.serialization.json.JsonPrimitive
