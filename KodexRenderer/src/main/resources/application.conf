# Every setting can be overridden with the environment variable on the line below it.
ktor {
    deployment {
        port = 8090
        port = ${?KODEX_PORT}
        host = "0.0.0.0"
        host = ${?KODEX_HOST}
    }
    application {
        modules = [ com.iktwo.kodex.renderer.ApplicationKt.module ]
    }
}

kodex {
    # Directory of <screen>.json files. Relative paths resolve against the working directory;
    # `./gradlew :KodexRenderer:run` runs from the repository root.
    screensDir = "KodexRenderer/screens"
    screensDir = ${?KODEX_SCREENS_DIR}

    # Screen every device is sent to by GET /display.
    defaultScreen = "dashboard"
    defaultScreen = ${?KODEX_DEFAULT_SCREEN}

    # How often devices should poll /display.
    refreshSeconds = 900
    refreshSeconds = ${?KODEX_REFRESH_SECONDS}

    # Shared secret. Empty disables auth; when set, /display and /render need
    # "Authorization: Bearer <token>".
    token = ""
    token = ${?KODEX_TOKEN}

    # Time zone and locale for the `now` data screens can show. Empty time zone = system default.
    timeZone = ""
    timeZone = ${?KODEX_TIMEZONE}
    locale = "en-US"
    locale = ${?KODEX_LOCALE}

    # The address clients reach this server at, e.g. "https://dash.example.com". Used for the asset
    # URLs in /content. Empty = taken from each request (scheme and Host header), which is right
    # unless a reverse proxy rewrites the Host header or terminates TLS.
    publicUrl = ""
    publicUrl = ${?KODEX_PUBLIC_URL}

    # What /display points devices at.
    display {
        width = 954
        width = ${?KODEX_DISPLAY_WIDTH}
        height = 1696
        height = ${?KODEX_DISPLAY_HEIGHT}
        mode = "gray16"
        mode = ${?KODEX_DISPLAY_MODE}
        density = 2.0
        density = ${?KODEX_DISPLAY_DENSITY}
    }
}
